name: Renovate

# Self-hosted Renovate for easydeploy-engine and the kits. It runs on GitHub's
# runners with an OpenComp-owned GitHub App, so no third-party Renovate service
# sees the repositories. Rules: renovate/easydeploy.json. Setup: docs/renovate.md.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get a token for the OpenComp Renovate app
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: opencomp-eu
          repositories: |
            easydeploy-engine
            kanidm-easy-deploy
            matrix-easy-deploy
            nextcloud-easy-deploy
            opencloud-easy-deploy
            stalwart-easy-deploy

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: >-
            ["opencomp-eu/easydeploy-engine",
             "opencomp-eu/kanidm-easy-deploy",
             "opencomp-eu/matrix-easy-deploy",
             "opencomp-eu/nextcloud-easy-deploy",
             "opencomp-eu/opencloud-easy-deploy",
             "opencomp-eu/stalwart-easy-deploy"]
          # Every repository already has renovate.json; skip onboarding PRs.
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Commit through the GitHub API so commits are signed and attributed to the app.
          RENOVATE_PLATFORM_COMMIT: enabled
